name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Set version from tag
      shell: bash
      run: |
        VERSION=${GITHUB_REF_NAME#v}
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        echo "Version set to $VERSION"

    - name: Restore NuGet packages
      run: msbuild AppTimeTracker.csproj /t:Restore /p:Configuration=Release /p:Version=${{ env.VERSION }}

    - name: Publish
      run: msbuild AppTimeTracker.csproj /t:Publish /p:Configuration=Release /p:RuntimeIdentifier=win-x64 /p:SelfContained=true /p:PublishSingleFile=true /p:Version=${{ env.VERSION }} /p:PublishDir=publish

    - name: Create zip artifact
      shell: pwsh
      run: |
        Compress-Archive -Path publish\AppTimeTracker.exe -DestinationPath AppTimeTracker.zip

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        name: Release ${{ env.VERSION }}
        files: AppTimeTracker.zip
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}